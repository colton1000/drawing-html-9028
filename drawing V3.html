<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>9028 — Glow & Color Wheel</title>
<style>
  :root{--bg:#f3f4f6;--panel:#fff;--accent:#0b74de;--muted:#6b7280;--danger:#ef4444}
  html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#111}
  .app{max-width:1280px;margin:18px auto;padding:16px;background:linear-gradient(180deg,#fff,#fbfdff);box-shadow:0 8px 30px rgba(15,23,42,0.06);border-radius:12px;display:grid;grid-template-columns:340px 1fr;gap:16px}
  .panel{background:var(--panel);padding:12px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(0,0,0,0.02)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button, select, input[type=range], input[type=color], input[type=text] {font-size:14px}
  button{background:#fff;border:1px solid #e6e9ee;padding:8px 10px;border-radius:8px;cursor:pointer}
  button.active{border-color:var(--accent);box-shadow:0 6px 14px rgba(11,116,222,0.12)}
  .colors{display:flex;gap:8px;flex-wrap:wrap}
  .color-swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid rgba(0,0,0,0.06)}
  .tools-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .canvas-wrap{position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(45deg,#fff,#f7fbff);display:flex;flex-direction:column}
  canvas{background:white;touch-action:none;display:block;width:100%;height:100%}
  .controls{display:flex;align-items:center;gap:10px;margin-top:8px}
  .saves{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:6px}
  .save-item{display:flex;align-items:center;gap:8px;background:#fbfdff;border-radius:8px;padding:6px;border:1px solid #eef3ff}
  .save-thumb{width:72px;height:50px;border-radius:6px;object-fit:cover;background:#fff;border:1px solid #e6eefc}
  .save-meta{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .small{font-size:13px;color:var(--muted)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .right-actions{display:flex;gap:8px;align-items:center}
  .title{font-weight:600}
  .danger{background:linear-gradient(180deg,#fff 0,#fff);border-color:var(--danger);color:var(--danger)}
  .row{display:flex;gap:8px;align-items:center}
  input.hex{width:110px;padding:6px;border-radius:6px;border:1px solid #e6e9ee}
  .color-preview{width:34px;height:34px;border-radius:6px;border:1px solid #e6e9ee}
  footer{grid-column:1/-1;margin-top:10px;text-align:center;color:var(--muted);font-size:13px}
  @media (max-width:920px){.app{grid-template-columns:1fr;max-width:920px}}
</style>
</head>
<body>
<div class="app" role="application" aria-label="Drawing app">
  <div class="panel" aria-hidden="false">
    <div class="topbar">
      <div>
        <div class="title">Canvas Rival — Glow & Color Wheel</div>
        <div class="small">Add glowing strokes and precise color controls</div>
      </div>
      <div class="right-actions">
        <button id="downloadBtn" title="Download PNG">Download</button>
        <button id="clearBtn" title="Clear canvas">Clear</button>
      </div>
    </div>

    <div class="tools-row">
      <div class="toolbar" role="toolbar" aria-label="tools">
        <button id="pencilBtn" class="active" title="Pencil">Pencil</button>
        <button id="fillBtn" title="Fill bucket">Fill</button>
        <button id="eraseBtn" title="Eraser">Eraser</button>
        <button id="saveBtn" title="Save to localStorage" style="background:linear-gradient(180deg,#eaf4ff,#dff0ff);border-color:#cbe7ff">Save</button>
      </div>
    </div>

    <div style="margin-top:8px">
      <label class="small">Brush size</label>
      <div class="controls">
        <input id="sizeRange" type="range" min="1" max="160" value="10" />
        <div id="sizeIndicator" class="small">10 px</div>
      </div>
    </div>

    <div style="margin-top:10px">
      <label class="small">Colors</label>
      <div class="colors" id="presetColors" style="margin-top:8px"></div>
      <div style="margin-top:8px" class="row">
        <input id="colorPicker" type="color" value="#111111" title="Color wheel" />
        <div style="display:flex;flex-direction:column;margin-left:6px">
          <label class="small">Hue</label>
          <input id="hueRange" type="range" min="0" max="360" value="0" />
        </div>
        <div style="display:flex;flex-direction:column;margin-left:6px">
          <label class="small">Preview</label>
          <div id="colorPreview" class="color-preview" title="Current color"></div>
        </div>
      </div>
      <div style="margin-top:8px" class="row">
        <input id="hexInput" class="hex" type="text" placeholder="Hex e.g. ffffdd or #ffffdd" maxlength="7" />
        <button id="applyHex">Apply</button>
        <div class="small" style="margin-left:8px">You can type hex without #</div>
      </div>
    </div>

    <div style="margin-top:12px">
      <label class="small">Texture</label>
      <div style="margin-top:8px" class="row">
        <select id="textureSelect" aria-label="Select texture">
          <option value="none">None</option>
          <option value="sandpaper">Sandpaper</option>
          <option value="watercolor">Watercolor</option>
          <option value="glow">Glowing</option>
        </select>
        <div class="small" id="textureInfo">None</div>
      </div>
      <div id="glowControls" style="margin-top:8px;display:none">
        <label class="small">Glow intensity</label>
        <input id="glowRange" type="range" min="0" max="3" step="0.1" value="1" />
        <div class="small" id="glowValue">1.0</div>
      </div>
    </div>

    <div style="margin-top:12px">
      <label class="small">Saves</label>
      <div class="saves" id="savesList" aria-live="polite"></div>
    </div>
  </div>

  <div class="canvas-wrap panel" style="padding:12px">
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
      <div class="small">Canvas</div>
      <div class="small" id="canvasSizeLabel">1600 × 840</div>
    </div>
    <div style="flex:1; min-height:420px;">
      <canvas id="canvas" width="1600" height="840" aria-label="Drawing canvas"></canvas>
    </div>
  </div>
</div>

<footer>
  Glowing texture uses additive blending and blur for a luminous effect. Saves persist in localStorage under key canvas-rival-saves-v3.
</footer>

<script>
/* ===== App variables ===== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const pencilBtn = document.getElementById('pencilBtn');
const fillBtn = document.getElementById('fillBtn');
const eraseBtn = document.getElementById('eraseBtn');
const saveBtn = document.getElementById('saveBtn');
const clearBtn = document.getElementById('clearBtn');
const downloadBtn = document.getElementById('downloadBtn');
const sizeRange = document.getElementById('sizeRange');
const sizeIndicator = document.getElementById('sizeIndicator');
const colorPicker = document.getElementById('colorPicker');
const hueRange = document.getElementById('hueRange');
const colorPreview = document.getElementById('colorPreview');
const presetColors = document.getElementById('presetColors');
const hexInput = document.getElementById('hexInput');
const applyHex = document.getElementById('applyHex');
const altOpacity = document.getElementById('altOpacity'); // not present but keep compatibility
const opacityLabel = document.getElementById('opacityLabel'); // not present
const savesList = document.getElementById('savesList');
const canvasSizeLabel = document.getElementById('canvasSizeLabel');
const textureSelect = document.getElementById('textureSelect');
const textureInfo = document.getElementById('textureInfo');
const glowControls = document.getElementById('glowControls');
const glowRange = document.getElementById('glowRange');
const glowValue = document.getElementById('glowValue');

let drawing = false;
let lastPos = {x:0,y:0};
let tool = 'pencil'; // pencil | fill | erase
let brushSize = parseInt(sizeRange.value,10);
let color = colorPicker.value;
let alpha = 1.0;
let eraserActive = false;
let texture = 'none';
let glowIntensity = parseFloat(glowRange.value);

/* ===== Initialize canvas backing and white background ===== */
function initCanvas() {
  canvas.width = 1600;
  canvas.height = 840;
  canvasSizeLabel.textContent = canvas.width + ' × ' + canvas.height;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
initCanvas();

/* ===== Preset colors ===== */
const preset = ['#000000','#ffffff','#ff3b30','#ff9500','#ffd60a','#32d74b','#0a84ff','#5856d6','#ff2d55','#8e8e93'];
preset.forEach(c=>{
  const s = document.createElement('div');
  s.className = 'color-swatch';
  s.style.background = c;
  s.title = c;
  s.addEventListener('click', ()=> {
    setColor(c);
  });
  presetColors.appendChild(s);
});

/* ===== Color controls (color wheel + hue slider + hex input) ===== */
function setColor(hex){
  if (!hex.startsWith('#')) hex = '#'+hex;
  // validate 3 or 6 char hex
  const isValid = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(hex);
  if (!isValid) return;
  color = expandHex(hex);
  colorPicker.value = color;
  // update hue slider to current hue
  const h = rgbToHslHex(color);
  hueRange.value = Math.round(h);
  updateColorPreview();
}
function expandHex(h){
  if (h.length === 4) return '#' + h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
  return h;
}
function updateColorPreview(){
  colorPreview.style.background = color;
}
colorPicker.addEventListener('input', ()=> {
  color = colorPicker.value;
  const h = rgbToHslHex(color);
  hueRange.value = Math.round(h);
  updateColorPreview();
});
hueRange.addEventListener('input', ()=> {
  // keep same saturation & lightness using temp conversion
  const h = parseInt(hueRange.value,10);
  const rgb = hslToRgb(h, 70, 40); // default moderate saturation/lightness
  color = rgbToHex(rgb.r, rgb.g, rgb.b);
  colorPicker.value = color;
  updateColorPreview();
});
applyHex.addEventListener('click', ()=> {
  const v = hexInput.value.trim();
  if (!v) return;
  const sanitized = v.replace('#','').toLowerCase();
  if (!/^([0-9a-f]{3}|[0-9a-f]{6})$/.test(sanitized)) { alert('Invalid hex code'); return; }
  setColor(sanitized);
});
hexInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') applyHex.click(); });

updateColorPreview();

/* helper conversions */
function rgbToHex(r,g,b){
  const toHex = v => ('0'+v.toString(16)).slice(-2);
  return '#'+toHex(r)+toHex(g)+toHex(b);
}
function hslToRgb(h,s,l){
  // h: 0-360, s,l: 0-100
  s /= 100; l /= 100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return { r: Math.round(255*f(0)), g: Math.round(255*f(8)), b: Math.round(255*f(4)) };
}
function rgbToHslHex(hex){
  // returns hue 0-360 for given hex
  const h = hex.replace('#','');
  const bigint = parseInt(h,16);
  const r = ((bigint >> 16) & 255)/255;
  const g = ((bigint >> 8) & 255)/255;
  const b = (bigint & 255)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let H=0;
  if (max === min) H = 0;
  else if (max === r) H = (60 * ((g - b) / (max - min)) + 360) % 360;
  else if (max === g) H = (60 * ((b - r) / (max - min)) + 120) % 360;
  else if (max === b) H = (60 * ((r - g) / (max - min)) + 240) % 360;
  return H;
}

/* ===== UI updates ===== */
function updateActiveUI(){
  pencilBtn.classList.toggle('active', tool === 'pencil' && !eraserActive);
  fillBtn.classList.toggle('active', tool === 'fill');
  eraseBtn.classList.toggle('active', eraserActive);
  sizeIndicator.textContent = brushSize + ' px';
  textureInfo.textContent = texture.charAt(0).toUpperCase() + texture.slice(1);
  glowControls.style.display = texture === 'glow' ? 'flex' : 'none';
  glowValue.textContent = glowIntensity.toFixed(1);
}
updateActiveUI();

/* ===== Tool buttons ===== */
pencilBtn.addEventListener('click', ()=>{ tool='pencil'; eraserActive=false; updateActiveUI(); });
fillBtn.addEventListener('click', ()=>{ tool='fill'; eraserActive=false; updateActiveUI(); });
eraseBtn.addEventListener('click', ()=>{
  // Click once to enable eraser; click again to return to color mode
  eraserActive = !eraserActive;
  tool = eraserActive ? 'erase' : 'pencil';
  updateActiveUI();
});
sizeRange.addEventListener('input', ()=>{ brushSize = parseInt(sizeRange.value,10); updateActiveUI(); });
textureSelect.addEventListener('change', ()=>{ texture = textureSelect.value; updateActiveUI(); });
glowRange.addEventListener('input', ()=>{ glowIntensity = parseFloat(glowRange.value); updateActiveUI(); });
clearBtn.addEventListener('click', ()=>{
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
});

/* ===== Pointer helpers ===== */
function getPosFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }
  return {
    x: Math.round((clientX - rect.left) * (canvas.width / rect.width)),
    y: Math.round((clientY - rect.top) * (canvas.height / rect.height))
  };
}

/* ===== Drawing with textures including Glow ===== */
function beginStroke(pos){
  drawing = true;
  lastPos = pos;
  ctx.beginPath();
  ctx.moveTo(pos.x + 0.5, pos.y + 0.5);
}
function moveStroke(pos){
  if (!drawing) return;
  const dist = Math.hypot(pos.x - lastPos.x, pos.y - lastPos.y);
  const steps = Math.max(1, Math.floor(dist / Math.max(1, brushSize / 6)));
  for (let i = 0; i <= steps; i++){
    const t = i/steps;
    const x = Math.round(lastPos.x + (pos.x - lastPos.x) * t);
    const y = Math.round(lastPos.y + (pos.y - lastPos.y) * t);
    applyStamp(x,y);
  }
  lastPos = pos;
}
function endStroke(){ if (!drawing) return; drawing = false; ctx.closePath(); }

function applyStamp(x,y){
  if (tool === 'fill') return;
  if (eraserActive){
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x,y, Math.max(1, brushSize/2), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    return;
  }

  if (texture === 'none'){
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = hexToRgba(color, alpha);
    ctx.beginPath();
    ctx.arc(x,y, Math.max(1, brushSize/2), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    return;
  }

  if (texture === 'sandpaper'){
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    const baseA = alpha * 0.95;
    const grit = Math.max(8, Math.floor(brushSize * 0.45));
    for (let i=0;i<grit;i++){
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * brushSize * 0.55;
      const rx = x + Math.cos(angle) * radius;
      const ry = y + Math.sin(angle) * radius;
      const size = Math.max(0.5, (Math.random() * 0.6 + 0.2) * (brushSize/8));
      ctx.fillStyle = hexToRgba(color, baseA * (0.4 + Math.random()*0.8));
      ctx.beginPath();
      ctx.arc(rx, ry, size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    return;
  }

  if (texture === 'watercolor'){
    const off = document.createElement('canvas');
    off.width = Math.ceil(brushSize*3);
    off.height = Math.ceil(brushSize*3);
    const octx = off.getContext('2d');
    const cx = off.width/2, cy = off.height/2;
    octx.clearRect(0,0,off.width,off.height);
    for (let i=0;i<6;i++){
      const s = (0.6 + Math.random()*0.8) * (brushSize/2);
      const rx = cx + (Math.random()-0.5) * brushSize*0.4;
      const ry = cy + (Math.random()-0.5) * brushSize*0.4;
      octx.beginPath();
      octx.fillStyle = hexToRgba(color, alpha * (0.12 + Math.random()*0.18));
      octx.ellipse(rx, ry, s, s * (0.6 + Math.random()*0.6), Math.random()*Math.PI, 0, Math.PI*2);
      octx.fill();
    }
    const tmp = document.createElement('canvas');
    tmp.width = Math.max(1, Math.floor(off.width / 3));
    tmp.height = Math.max(1, Math.floor(off.height / 3));
    const tctx = tmp.getContext('2d');
    tctx.drawImage(off, 0, 0, tmp.width, tmp.height);
    octx.clearRect(0,0,off.width,off.height);
    octx.globalAlpha = 1.0;
    octx.drawImage(tmp, 0, 0, tmp.width, tmp.height, 0, 0, off.width, off.height);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(off, x - cx, y - cy);
    ctx.restore();
    return;
  }

  if (texture === 'glow'){
    // Create offscreen stamp with strong core + blurred glow; draw with additive blending
    const off = document.createElement('canvas');
    const diameter = Math.ceil(brushSize * 3.2);
    off.width = diameter; off.height = diameter;
    const octx = off.getContext('2d');
    const cx = diameter/2, cy = diameter/2;

    // core: solid circle at center
    octx.clearRect(0,0,off.width,off.height);
    octx.beginPath();
    octx.fillStyle = hexToRgba(color, Math.min(1, alpha));
    octx.arc(cx, cy, brushSize/2, 0, Math.PI*2);
    octx.fill();

    // outer glow layers: draw multiple radial gradients for soft bloom
    const gcount = Math.max(3, Math.round(2 + glowIntensity*3));
    for (let i=0;i<gcount;i++){
      const grd = octx.createRadialGradient(cx, cy, brushSize*0.2, cx, cy, brushSize*(1.2 + i*0.9));
      const step = Math.max(0.15, (0.25 + i*0.12) / glowIntensity);
      const alphaOuter = Math.min(0.35 * glowIntensity, 0.75) * (1 - i*0.18);
      grd.addColorStop(0, hexToRgba(color, alphaOuter));
      grd.addColorStop(1, hexToRgba(color, 0));
      octx.globalCompositeOperation = 'lighter';
      octx.fillStyle = grd;
      octx.beginPath();
      octx.arc(cx, cy, brushSize*(1.2 + i*0.9), 0, Math.PI*2);
      octx.fill();
    }

    // Use additive blending to place onto main canvas for luminous effect
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(off, x - cx, y - cy);
    ctx.restore();
    return;
  }
}

/* ===== Pointer events ===== */
canvas.addEventListener('pointerdown', (e)=> {
  canvas.setPointerCapture(e.pointerId);
  const pos = getPosFromEvent(e);
  if (tool === 'fill'){
    const rgba = colorToRgba(color, alpha);
    floodFill(canvas, pos.x, pos.y, rgba);
  } else {
    beginStroke(pos);
    applyStamp(pos.x, pos.y);
  }
});
canvas.addEventListener('pointermove', (e)=> {
  const pos = getPosFromEvent(e);
  if (drawing) moveStroke(pos);
});
canvas.addEventListener('pointerup', (e)=> { endStroke(); });
canvas.addEventListener('pointercancel', ()=> endStroke());

/* ===== Utilities: color conversions ===== */
function hexToRgba(hex, a){
  if (!hex) hex = '#000000';
  if (!hex.startsWith('#')) hex = '#'+hex;
  const h = hex.replace('#','');
  const bigint = parseInt(expandHex('#'+h).replace('#',''),16);
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return `rgba(${r},${g},${b},${a})`;
}
function colorToRgba(hex, a){
  if (!hex.startsWith('#')) hex = '#'+hex;
  const h = hex.replace('#','');
  const bigint = parseInt(expandHex('#'+h).replace('#',''),16);
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return {r,g,b,a: Math.round(a*255)};
}

/* ===== Flood fill (iterative scanline) ===== */
function getPixelIndex(x,y,w){ return (y*w + x) * 4; }
function colorsMatch(px, target){ return px[0] === target[0] && px[1] === target[1] && px[2] === target[2] && px[3] === target[3]; }
function floodFill(canvasEl, startX, startY, fillRGBA){
  const w = canvasEl.width, h = canvasEl.height;
  const ctxLocal = canvasEl.getContext('2d');
  let img = ctxLocal.getImageData(0,0,w,h);
  const data = img.data;
  const startIdx = getPixelIndex(startX, startY, w);
  const target = [data[startIdx], data[startIdx+1], data[startIdx+2], data[startIdx+3]];
  const replacement = [fillRGBA.r, fillRGBA.g, fillRGBA.b, fillRGBA.a];
  if (target[0] === replacement[0] && target[1] === replacement[1] && target[2] === replacement[2] && target[3] === replacement[3]) return;
  const stack = [[startX, startY]];
  while(stack.length){
    const [sx,sy] = stack.pop();
    let x = sx, y = sy;
    let idx = getPixelIndex(x,y,w);
    while(y >= 0 && colorsMatch([data[idx],data[idx+1],data[idx+2],data[idx+3]], target)){ y--; idx -= w*4; if (y < 0) break; }
    y++; idx += w*4;
    let reachLeft = false, reachRight = false;
    while(y < h && colorsMatch([data[idx],data[idx+1],data[idx+2],data[idx+3]], target)){
      data[idx] = replacement[0]; data[idx+1] = replacement[1]; data[idx+2] = replacement[2]; data[idx+3] = replacement[3];
      if (x > 0){
        if (colorsMatch([data[idx-4],data[idx-3],data[idx-2],data[idx-1]], target)){
          if (!reachLeft){ stack.push([x-1,y]); reachLeft = true; }
        } else reachLeft = false;
      }
      if (x < w-1){
        if (colorsMatch([data[idx+4],data[idx+5],data[idx+6],data[idx+7]], target)){
          if (!reachRight){ stack.push([x+1,y]); reachRight = true; }
        } else reachRight = false;
      }
      y++; idx += w*4;
    }
  }
  ctxLocal.putImageData(img,0,0);
}

/* ===== Save / localStorage gallery ===== */
const STORAGE_KEY = 'canvas-rival-saves-v3';
function saveCurrent(){
  const dataUrl = canvas.toDataURL('image/png');
  const saves = loadSaves();
  const id = 's-' + Date.now();
  saves.unshift({id, dataUrl, created: new Date().toISOString()});
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saves.slice(0,50)));
  renderSaves();
}
function loadSaves(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    return JSON.parse(raw);
  } catch(e){ return []; }
}
function renderSaves(){
  savesList.innerHTML = '';
  const saves = loadSaves();
  if (!saves.length){
    const empty = document.createElement('div');
    empty.className = 'small';
    empty.textContent = 'No saves yet. Click Save to store your drawing in the browser.';
    savesList.appendChild(empty);
    return;
  }
  saves.forEach(s=>{
    const item = document.createElement('div');
    item.className = 'save-item';
    const img = document.createElement('img');
    img.className = 'save-thumb';
    img.src = s.dataUrl;
    img.alt = 'save thumbnail';
    img.addEventListener('click', ()=> {
      if (!confirm('Replace canvas with this saved image?')) return;
      const image = new Image();
      image.onload = ()=> {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(image,0,0,canvas.width,canvas.height);
        ctx.restore();
      };
      image.src = s.dataUrl;
    });
    const meta = document.createElement('div');
    meta.className = 'save-meta';
    const left = document.createElement('div');
    left.innerHTML = '<div style="font-weight:600">'+ (new Date(s.created)).toLocaleString() +'</div><div class="small">Saved in browser</div>';
    const right = document.createElement('div');
    right.style.display = 'flex';
    right.style.gap = '6px';
    const openBtn = document.createElement('button');
    openBtn.innerText = 'Open';
    openBtn.addEventListener('click', ()=> {
      const w = window.open();
      w.document.write('<img src="'+s.dataUrl+'" style="max-width:100%;height:auto;display:block;margin:0"/>');
    });
    const remove = document.createElement('button');
    remove.innerText = 'X';
    remove.className = 'danger';
    remove.title = 'Delete save';
    remove.addEventListener('click', ()=> {
      if (!confirm('Delete this save?')) return;
      const arr = loadSaves().filter(x=>x.id !== s.id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
      renderSaves();
    });
    right.appendChild(openBtn);
    right.appendChild(remove);
    meta.appendChild(left);
    meta.appendChild(right);
    item.appendChild(img);
    item.appendChild(meta);
    savesList.appendChild(item);
  });
}
saveBtn.addEventListener('click', saveCurrent);
renderSaves();

/* ===== Download button ===== */
downloadBtn.addEventListener('click', ()=>{
  const dataUrl = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'drawing.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

/* ===== Keyboard shortcuts ===== */
window.addEventListener('keydown', (e)=>{
  if (e.key === 'b') { tool='pencil'; eraserActive=false; updateActiveUI(); }
  if (e.key === 'e') { eraserActive = !eraserActive; tool = eraserActive ? 'erase' : 'pencil'; updateActiveUI(); }
  if (e.key === 'f') { tool='fill'; eraserActive=false; updateActiveUI(); }
  if (e.key === 's' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); saveCurrent(); }
});

/* ===== Notes =====
 - Glowing texture uses additive blending 'lighter' and layered radial gradients to simulate bloom.
 - Hex input accepts values like ffffdd or #ffffdd. Hue slider offers quick sweeping.
 - Eraser toggles on/off (click Eraser once to enable, click again to return to color).
*/
