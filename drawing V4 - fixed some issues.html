<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>9028 — Symmetry & Tiled Modes</title>
<style>
  :root{--bg:#f3f4f6;--panel:#fff;--accent:#0b74de;--muted:#6b7280;--danger:#ef4444}
  html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#111}
  .app{max-width:1280px;margin:18px auto;padding:16px;background:linear-gradient(180deg,#fff,#fbfdff);box-shadow:0 8px 30px rgba(15,23,42,0.06);border-radius:12px;display:grid;grid-template-columns:360px 1fr;gap:16px}
  .panel{background:var(--panel);padding:12px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(0,0,0,0.02)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button, select, input[type=range], input[type=color], input[type=text] {font-size:14px}
  button{background:#fff;border:1px solid #e6e9ee;padding:8px 10px;border-radius:8px;cursor:pointer}
  button.active{border-color:var(--accent);box-shadow:0 6px 14px rgba(11,116,222,0.12)}
  .colors{display:flex;gap:8px;flex-wrap:wrap}
  .color-swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid rgba(0,0,0,0.06)}
  .tools-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .canvas-wrap{position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(45deg,#fff,#f7fbff);display:flex;flex-direction:column}
  canvas{background:white;touch-action:none;display:block;width:100%;height:100%}
  .controls{display:flex;align-items:center;gap:10px;margin-top:8px}
  .saves{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto;padding-right:6px}
  .save-item{display:flex;align-items:center;gap:8px;background:#fbfdff;border-radius:8px;padding:6px;border:1px solid #eef3ff}
  .save-thumb{width:72px;height:50px;border-radius:6px;object-fit:cover;background:#fff;border:1px solid #e6eefc}
  .save-meta{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .small{font-size:13px;color:var(--muted)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .right-actions{display:flex;gap:8px;align-items:center}
  .title{font-weight:600}
  .danger{background:linear-gradient(180deg,#fff 0,#fff);border-color:var(--danger);color:var(--danger)}
  .row{display:flex;gap:8px;align-items:center}
  input.hex{width:110px;padding:6px;border-radius:6px;border:1px solid #e6e9ee}
  .color-preview{width:34px;height:34px;border-radius:6px;border:1px solid #e6e9ee}
  footer{grid-column:1/-1;margin-top:10px;text-align:center;color:var(--muted);font-size:13px}
  @media (max-width:920px){.app{grid-template-columns:1fr;max-width:920px}}
</style>
</head>
<body>
<div class="app" role="application" aria-label="Drawing app">
  <div class="panel" aria-hidden="false">
    <div class="topbar">
      <div>
        <div class="title">Canvas Rival — Symmetry & Tiled</div>
        <div class="small">Mirror, radial symmetry and seamless tiled repeat</div>
      </div>
      <div class="right-actions">
        <button id="downloadBtn" title="Download PNG">Download</button>
        <button id="clearBtn" title="Clear canvas">Clear</button>
      </div>
    </div>

    <div class="tools-row">
      <div class="toolbar" role="toolbar" aria-label="tools">
        <button id="pencilBtn" class="active" title="Pencil">Pencil</button>
        <button id="fillBtn" title="Fill bucket">Fill</button>
        <button id="eraseBtn" title="Eraser">Eraser</button>
        <button id="saveBtn" title="Save to localStorage" style="background:linear-gradient(180deg,#eaf4ff,#dff0ff);border-color:#cbe7ff">Save</button>
      </div>
    </div>

    <div style="margin-top:8px">
      <label class="small">Brush size</label>
      <div class="controls">
        <input id="sizeRange" type="range" min="1" max="160" value="12" />
        <div id="sizeIndicator" class="small">12 px</div>
      </div>
    </div>

    <div style="margin-top:10px">
      <label class="small">Colors</label>
      <div class="colors" id="presetColors" style="margin-top:8px"></div>
      <div style="margin-top:8px" class="row">
        <input id="colorPicker" type="color" value="#111111" title="Color wheel" />
        <div style="display:flex;flex-direction:column;margin-left:6px">
          <label class="small">Hue</label>
          <input id="hueRange" type="range" min="0" max="360" value="0" />
        </div>
        <div style="display:flex;flex-direction:column;margin-left:6px">
          <label class="small">Preview</label>
          <div id="colorPreview" class="color-preview" title="Current color"></div>
        </div>
      </div>
      <div style="margin-top:8px" class="row">
        <input id="hexInput" class="hex" type="text" placeholder="Hex e.g. ffffdd or #ffffdd" maxlength="7" />
        <button id="applyHex">Apply</button>
      </div>
    </div>

    <div style="margin-top:12px">
      <label class="small">Texture</label>
      <div style="margin-top:8px" class="row">
        <select id="textureSelect" aria-label="Select texture">
          <option value="none">None</option>
          <option value="sandpaper">Sandpaper</option>
          <option value="watercolor">Watercolor</option>
          <option value="glow">Glowing</option>
        </select>
        <div class="small" id="textureInfo">None</div>
      </div>
      <div id="glowControls" style="margin-top:8px;display:none">
        <label class="small">Glow intensity</label>
        <input id="glowRange" type="range" min="0" max="3" step="0.1" value="1" />
        <div class="small" id="glowValue">1.0</div>
      </div>
    </div>

    <hr style="margin:12px 0">

    <div>
      <label class="small">Symmetry</label>
      <div style="margin-top:8px" class="row">
        <select id="symmetryMode">
          <option value="off">Off</option>
          <option value="vertical">Mirror Vertical</option>
          <option value="horizontal">Mirror Horizontal</option>
          <option value="both">Mirror Both</option>
          <option value="radial">Radial N-way</option>
        </select>
        <div class="small" id="symInfo">Off</div>
      </div>
      <div id="radialControls" style="margin-top:8px;display:none" class="row">
        <label class="small">Spokes</label>
        <input id="radialSpokes" type="range" min="2" max="18" value="6" />
        <div class="small" id="radialValue">6</div>
      </div>

      <div style="margin-top:10px" class="row">
        <label class="small">Tiled Seamless Repeat</label>
        <input id="tileToggle" type="checkbox" />
        <div class="small" style="margin-left:6px">Wrap strokes across edges (2×2 repeat)</div>
      </div>
    </div>

    <div style="margin-top:12px">
      <label class="small">Saves</label>
      <div class="saves" id="savesList" aria-live="polite"></div>
    </div>
  </div>

  <div class="canvas-wrap panel" style="padding:12px">
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
      <div class="small">Canvas</div>
      <div class="small" id="canvasSizeLabel">1600 × 840</div>
    </div>
    <div style="flex:1; min-height:420px;position:relative;">
      <canvas id="canvas" width="1600" height="840" aria-label="Drawing canvas"></canvas>
      <!-- optional overlay to show symmetry guides -->
      <canvas id="guideCanvas" width="1600" height="840" aria-hidden="true" style="position:absolute;left:12px;top:12px;pointer-events:none;opacity:0.25"></canvas>
    </div>
  </div>
</div>

<footer>
  Symmetry duplicates stamps geometrically; tiled repeat wraps stamps at edges. Save as usual.
</footer>

<script>
/* ===== Constants ===== */
const CONFIG = {
  STORAGE_KEY: 'canvas-rival-saves-v4',
  MAX_SAVES: 50,
  CANVAS_WIDTH: 2000,
  CANVAS_HEIGHT: 1040,
  GRIT_MULTIPLIER: 0.45,
  WATERCOLOR_LAYERS: 6,
  GLOW_RINGS_BASE: 2,
  GLOW_RINGS_MULT: 3,
  TILE_REPEAT: 3,
  PRESET_COLORS: ['#000000','#ffffff','#ff3b30','#ff9500','#ffd60a','#32d74b','#0a84ff','#5856d6','#ff2d55','#8e8e93']
};

/* ===== App state ===== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const guideCanvas = document.getElementById('guideCanvas');
const gctx = guideCanvas.getContext('2d');
const pencilBtn = document.getElementById('pencilBtn');
const fillBtn = document.getElementById('fillBtn');
const eraseBtn = document.getElementById('eraseBtn');
const saveBtn = document.getElementById('saveBtn');
const clearBtn = document.getElementById('clearBtn');
const downloadBtn = document.getElementById('downloadBtn');
const sizeRange = document.getElementById('sizeRange');
const sizeIndicator = document.getElementById('sizeIndicator');
const colorPicker = document.getElementById('colorPicker');
const hueRange = document.getElementById('hueRange');
const colorPreview = document.getElementById('colorPreview');
const presetColors = document.getElementById('presetColors');
const hexInput = document.getElementById('hexInput');
const applyHex = document.getElementById('applyHex');
const savesList = document.getElementById('savesList');
const canvasSizeLabel = document.getElementById('canvasSizeLabel');
const textureSelect = document.getElementById('textureSelect');
const textureInfo = document.getElementById('textureInfo');
const glowControls = document.getElementById('glowControls');
const glowRange = document.getElementById('glowRange');
const glowValue = document.getElementById('glowValue');

const symmetryModeSelect = document.getElementById('symmetryMode');
const symInfo = document.getElementById('symInfo');
const radialControls = document.getElementById('radialControls');
const radialSpokes = document.getElementById('radialSpokes');
const radialValue = document.getElementById('radialValue');
const tileToggle = document.getElementById('tileToggle');

let state = {
  drawing: false,
  lastPos: { x: 0, y: 0 },
  tool: 'pencil',
  brushSize: parseInt(sizeRange.value, 10),
  color: colorPicker.value,
  alpha: 1.0,
  eraserActive: false,
  texture: 'none',
  glowIntensity: parseFloat(glowRange.value),
  symmetryMode: 'off',
  radialN: parseInt(radialSpokes.value, 10),
  tiled: false
};

/* ===== Initialize canvas ===== */
function initCanvas() {
  canvas.width = CONFIG.CANVAS_WIDTH;
  canvas.height = CONFIG.CANVAS_HEIGHT;
  guideCanvas.width = canvas.width;
  guideCanvas.height = canvas.height;
  canvasSizeLabel.textContent = `${canvas.width} × ${canvas.height}`;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  drawGuides();
}
initCanvas();

/* ===== Preset colors ===== */
CONFIG.PRESET_COLORS.forEach(c => {
  const s = document.createElement('div');
  s.className = 'color-swatch';
  s.style.background = c;
  s.title = c;
  s.addEventListener('click', () => setColor(c));
  presetColors.appendChild(s);
});

/* ===== Color helpers (improved with validation) ===== */
function rgbToHex(r, g, b) {
  const toHex = v => ('0' + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2);
  return '#' + toHex(r) + toHex(g) + toHex(b);
}

function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; // normalize hue
  s /= 100;
  l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return { r: Math.round(255 * f(0)), g: Math.round(255 * f(8)), b: Math.round(255 * f(4)) };
}

function rgbToHslHex(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const bigint = parseInt(hex, 16);
  const r = ((bigint >> 16) & 255) / 255;
  const g = ((bigint >> 8) & 255) / 255;
  const b = (bigint & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let H = 0;
  if (max !== min) {
    const delta = max - min;
    if (max === r) H = (60 * (((g - b) / delta + 6) % 6)) % 360;
    else if (max === g) H = (60 * ((b - r) / delta + 2)) % 360;
    else H = (60 * ((r - g) / delta + 4)) % 360;
  }
  return H;
}

function expandHex(h) {
  if (h.length === 4) return '#' + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
  return h;
}

function hexToRgba(hex, a) {
  if (!hex || !hex.startsWith('#')) hex = '#' + (hex || '000000');
  const h = expandHex(hex).replace('#', '').toLowerCase();
  const bigint = parseInt(h, 16) || 0;
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, a))})`;
}

function colorToRgba(hex, a) {
  if (!hex.startsWith('#')) hex = '#' + hex;
  const h = expandHex(hex).replace('#', '').toLowerCase();
  const bigint = parseInt(h, 16) || 0;
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return { r, g, b, a: Math.round(Math.max(0, Math.min(1, a)) * 255) };
}

function setColor(hex) {
  if (!hex.startsWith('#')) hex = '#' + hex;
  const isValid = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(hex);
  if (!isValid) return;
  state.color = expandHex(hex);
  colorPicker.value = state.color;
  const h = rgbToHslHex(state.color);
  hueRange.value = Math.round(h);
  updateColorPreview();
}

function updateColorPreview() {
  colorPreview.style.background = state.color;
}

// ...existing color event listeners...
colorPicker.addEventListener('input', () => {
  state.color = colorPicker.value;
  hueRange.value = Math.round(rgbToHslHex(state.color));
  updateColorPreview();
});

hueRange.addEventListener('input', () => {
  const h = parseInt(hueRange.value, 10);
  const rgb = hslToRgb(h, 70, 40);
  state.color = rgbToHex(rgb.r, rgb.g, rgb.b);
  colorPicker.value = state.color;
  updateColorPreview();
});

applyHex.addEventListener('click', () => {
  const v = hexInput.value.trim();
  if (!v) return;
  const s = v.replace('#', '').toLowerCase();
  if (!/^([0-9a-f]{3}|[0-9a-f]{6})$/.test(s)) {
    alert('Invalid hex color');
    return;
  }
  setColor(s);
});

hexInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') applyHex.click();
});

updateColorPreview();

/* ===== UI state management ===== */
function updateUI() {
  pencilBtn.classList.toggle('active', state.tool === 'pencil' && !state.eraserActive);
  fillBtn.classList.toggle('active', state.tool === 'fill');
  eraseBtn.classList.toggle('active', state.eraserActive);
  sizeIndicator.textContent = `${state.brushSize} px`;
  textureInfo.textContent = state.texture.charAt(0).toUpperCase() + state.texture.slice(1);
  glowControls.style.display = state.texture === 'glow' ? 'flex' : 'none';
  glowValue.textContent = state.glowIntensity.toFixed(1);
  symInfo.textContent = state.symmetryMode.charAt(0).toUpperCase() + state.symmetryMode.slice(1);
  radialControls.style.display = state.symmetryMode === 'radial' ? 'flex' : 'none';
  radialValue.textContent = state.radialN;
}
updateUI();

/* ===== Tool event listeners ===== */
pencilBtn.addEventListener('click', () => {
  state.tool = 'pencil';
  state.eraserActive = false;
  updateUI();
});

fillBtn.addEventListener('click', () => {
  state.tool = 'fill';
  state.eraserActive = false;
  updateUI();
});

eraseBtn.addEventListener('click', () => {
  state.eraserActive = !state.eraserActive;
  state.tool = state.eraserActive ? 'erase' : 'pencil';
  updateUI();
});

sizeRange.addEventListener('input', () => {
  state.brushSize = parseInt(sizeRange.value, 10);
  updateUI();
});

textureSelect.addEventListener('change', () => {
  state.texture = textureSelect.value;
  updateUI();
});

glowRange.addEventListener('input', () => {
  state.glowIntensity = parseFloat(glowRange.value);
  updateUI();
});

clearBtn.addEventListener('click', () => {
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
  drawGuides();
});

symmetryModeSelect.addEventListener('change', () => {
  state.symmetryMode = symmetryModeSelect.value;
  updateUI();
  drawGuides();
});

radialSpokes.addEventListener('input', () => {
  state.radialN = parseInt(radialSpokes.value, 10);
  radialValue.textContent = state.radialN;
});

tileToggle.addEventListener('change', () => {
  state.tiled = tileToggle.checked;
  drawGuides();
});

/* ===== Pointer helpers ===== */
function getPosFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return {
    x: Math.round((clientX - rect.left) * (canvas.width / rect.width)),
    y: Math.round((clientY - rect.top) * (canvas.height / rect.height))
  };
}

/* ===== Optimized replicatedPoints ===== */
function replicatedPoints(x, y) {
  const w = canvas.width, h = canvas.height;
  const points = [];
  const setKey = new Set();

  function addUniquePoint(px, py) {
    if (!state.tiled) {
      const k = `${px}:${py}`;
      if (!setKey.has(k)) {
        setKey.add(k);
        points.push([px, py]);
      }
      return;
    }

    // For tiled: generate 3×3 grid around primary canvas
    const range = Math.floor(CONFIG.TILE_REPEAT / 2);
    for (let sx = -range; sx <= range; sx++) {
      for (let sy = -range; sy <= range; sy++) {
        const nx = px + sx * w;
        const ny = py + sy * h;
        const k = `${nx}:${ny}`;
        if (!setKey.has(k)) {
          setKey.add(k);
          points.push([nx, ny]);
        }
      }
    }
  }

  const cx = w / 2, cy = h / 2;

  if (state.symmetryMode === 'off') {
    addUniquePoint(x, y);
  } else if (state.symmetryMode === 'vertical' || state.symmetryMode === 'both') {
    const mx = Math.round(cx * 2 - x);
    addUniquePoint(x, y);
    addUniquePoint(mx, y);
    if (state.symmetryMode === 'both') {
      const my = Math.round(cy * 2 - y);
      addUniquePoint(x, my);
      addUniquePoint(mx, my);
    }
  } else if (state.symmetryMode === 'horizontal') {
    const my = Math.round(cy * 2 - y);
    addUniquePoint(x, y);
    addUniquePoint(x, my);
  } else if (state.symmetryMode === 'radial') {
    const dx = x - cx, dy = y - cy;
    const r = Math.hypot(dx, dy);
    const baseAngle = Math.atan2(dy, dx);
    for (let k = 0; k < state.radialN; k++) {
      const ang = baseAngle + (k * 2 * Math.PI / state.radialN);
      const px = Math.round(cx + r * Math.cos(ang));
      const py = Math.round(cy + r * Math.sin(ang));
      addUniquePoint(px, py);
    }
  }

  return points;
}

/* ===== Texture rendering engine ===== */
const textureEngines = {
  none: (px, py) => {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = hexToRgba(state.color, state.alpha);
    ctx.beginPath();
    ctx.arc(px, py, Math.max(1, state.brushSize / 2), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  },

  sandpaper: (px, py) => {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    const baseA = state.alpha * 0.95;
    const grit = Math.max(8, Math.floor(state.brushSize * CONFIG.GRIT_MULTIPLIER));
    for (let i = 0; i < grit; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * state.brushSize * 0.55;
      const rx = px + Math.cos(angle) * radius;
      const ry = py + Math.sin(angle) * radius;
      const size = Math.max(0.5, (Math.random() * 0.6 + 0.2) * (state.brushSize / 8));
      ctx.fillStyle = hexToRgba(state.color, baseA * (0.4 + Math.random() * 0.8));
      ctx.beginPath();
      ctx.arc(rx, ry, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  },

  watercolor: (px, py) => {
    const off = document.createElement('canvas');
    off.width = Math.ceil(state.brushSize * 3);
    off.height = Math.ceil(state.brushSize * 3);
    const octx = off.getContext('2d');
    const cx = off.width / 2, cy = off.height / 2;
    octx.clearRect(0, 0, off.width, off.height);

    for (let i = 0; i < CONFIG.WATERCOLOR_LAYERS; i++) {
      const s = (0.6 + Math.random() * 0.8) * (state.brushSize / 2);
      const rx = cx + (Math.random() - 0.5) * state.brushSize * 0.4;
      const ry = cy + (Math.random() - 0.5) * state.brushSize * 0.4;
      octx.beginPath();
      octx.fillStyle = hexToRgba(state.color, state.alpha * (0.12 + Math.random() * 0.18));
      octx.ellipse(rx, ry, s, s * (0.6 + Math.random() * 0.6), Math.random() * Math.PI, 0, Math.PI * 2);
      octx.fill();
    }

    const tmp = document.createElement('canvas');
    tmp.width = Math.max(1, Math.floor(off.width / 3));
    tmp.height = Math.max(1, Math.floor(off.height / 3));
    const tctx = tmp.getContext('2d');
    tctx.drawImage(off, 0, 0, tmp.width, tmp.height);
    octx.clearRect(0, 0, off.width, off.height);
    octx.globalAlpha = 1.0;
    octx.drawImage(tmp, 0, 0, tmp.width, tmp.height, 0, 0, off.width, off.height);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(off, px - cx, py - cy);
    ctx.restore();
  },

  glow: (px, py) => {
    const off = document.createElement('canvas');
    const diameter = Math.ceil(state.brushSize * 3.2);
    off.width = diameter;
    off.height = diameter;
    const octx = off.getContext('2d');
    const cx = diameter / 2, cy = diameter / 2;
    octx.clearRect(0, 0, off.width, off.height);

    // Core
    octx.beginPath();
    octx.fillStyle = hexToRgba(state.color, Math.min(1, state.alpha));
    octx.arc(cx, cy, state.brushSize / 2, 0, Math.PI * 2);
    octx.fill();

    // Glow rings
    const gcount = Math.max(CONFIG.GLOW_RINGS_BASE, Math.round(CONFIG.GLOW_RINGS_BASE + state.glowIntensity * CONFIG.GLOW_RINGS_MULT));
    for (let i = 0; i < gcount; i++) {
      const grd = octx.createRadialGradient(cx, cy, state.brushSize * 0.2, cx, cy, state.brushSize * (1.2 + i * 0.9));
      const alphaOuter = Math.min(0.35 * state.glowIntensity, 0.75) * (1 - i * 0.18);
      grd.addColorStop(0, hexToRgba(state.color, alphaOuter));
      grd.addColorStop(1, hexToRgba(state.color, 0));
      octx.globalCompositeOperation = 'lighter';
      octx.fillStyle = grd;
      octx.beginPath();
      octx.arc(cx, cy, state.brushSize * (1.2 + i * 0.9), 0, Math.PI * 2);
      octx.fill();
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(off, px - cx, py - cy);
    ctx.restore();
  }
};

function drawStampAt(px, py) {
  if (state.eraserActive) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(px, py, Math.max(1, state.brushSize / 2), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }

  const engine = textureEngines[state.texture] || textureEngines.none;
  engine(px, py);
}

/* ===== Drawing pipeline ===== */
function applyStamp(x, y) {
  const points = replicatedPoints(x, y);
  points.forEach(([px, py]) => {
    if (!state.tiled && (px < 0 || py < 0 || px > canvas.width || py > canvas.height)) return;
    drawStampAt(px, py);
  });
}

function beginStroke(pos) {
  state.drawing = true;
  state.lastPos = pos;
}

function moveStroke(pos) {
  if (!state.drawing) return;
  const dist = Math.hypot(pos.x - state.lastPos.x, pos.y - state.lastPos.y);
  const steps = Math.max(1, Math.floor(dist / Math.max(1, state.brushSize / 6)));
  for (let i = 0; i <= steps; i++) {
    const t = steps ? i / steps : 0;
    const x = Math.round(state.lastPos.x + (pos.x - state.lastPos.x) * t);
    const y = Math.round(state.lastPos.y + (pos.y - state.lastPos.y) * t);
    applyStamp(x, y);
  }
  state.lastPos = pos;
}

function endStroke() {
  state.drawing = false;
}

/* ===== Pointer events ===== */
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  const pos = getPosFromEvent(e);
  if (state.tool === 'fill') {
    const rgba = colorToRgba(state.color, state.alpha);
    floodFill(canvas, pos.x, pos.y, rgba);
    drawGuides();
    return;
  }
  beginStroke(pos);
  applyStamp(pos.x, pos.y);
  drawGuides();
});

canvas.addEventListener('pointermove', (e) => {
  const pos = getPosFromEvent(e);
  if (state.drawing) moveStroke(pos);
});

canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
canvas.addEventListener('touchstart', () => {}, { passive: true });

/* ===== Optimized flood fill ===== */
function getPixelIndex(x, y, w) {
  return (y * w + x) * 4;
}

function colorsMatch(px, target) {
  return px[0] === target[0] && px[1] === target[1] && px[2] === target[2] && px[3] === target[3];
}

function floodFill(canvasEl, startX, startY, fillRGBA) {
  const w = canvasEl.width, h = canvasEl.height;
  if (startX < 0 || startY < 0 || startX >= w || startY >= h) return; // early exit
  const ctxLocal = canvasEl.getContext('2d');
  let img = ctxLocal.getImageData(0, 0, w, h);
  const data = img.data;
  const startIdx = getPixelIndex(startX, startY, w);
  const target = [data[startIdx], data[startIdx + 1], data[startIdx + 2], data[startIdx + 3]];
  const replacement = [fillRGBA.r, fillRGBA.g, fillRGBA.b, fillRGBA.a];

  if (target[0] === replacement[0] && target[1] === replacement[1] && target[2] === replacement[2] && target[3] === replacement[3]) {
    return; // early exit if same color
  }

  const stack = [[startX, startY]];
  while (stack.length) {
    const [sx, sy] = stack.pop();
    let x = sx, y = sy;
    let idx = getPixelIndex(x, y, w);

    while (y >= 0 && colorsMatch([data[idx], data[idx + 1], data[idx + 2], data[idx + 3]], target)) {
      y--;
      idx -= w * 4;
      if (y < 0) break;
    }

    y++;
    idx += w * 4;
    let reachLeft = false, reachRight = false;

    while (y < h && colorsMatch([data[idx], data[idx + 1], data[idx + 2], data[idx + 3]], target)) {
      data[idx] = replacement[0];
      data[idx + 1] = replacement[1];
      data[idx + 2] = replacement[2];
      data[idx + 3] = replacement[3];

      if (x > 0) {
        if (colorsMatch([data[idx - 4], data[idx - 3], data[idx - 2], data[idx - 1]], target)) {
          if (!reachLeft) {
            stack.push([x - 1, y]);
            reachLeft = true;
          }
        } else {
          reachLeft = false;
        }
      }

      if (x < w - 1) {
        if (colorsMatch([data[idx + 4], data[idx + 5], data[idx + 6], data[idx + 7]], target)) {
          if (!reachRight) {
            stack.push([x + 1, y]);
            reachRight = true;
          }
        } else {
          reachRight = false;
        }
      }

      y++;
      idx += w * 4;
    }
  }

  ctxLocal.putImageData(img, 0, 0);
}

/* ===== Saves gallery ===== */
function saveCurrent() {
  const dataUrl = canvas.toDataURL('image/png');
  const saves = loadSaves();
  const id = 's-' + Date.now();
  saves.unshift({ id, dataUrl, created: new Date().toISOString() });
  localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(saves.slice(0, CONFIG.MAX_SAVES)));
  renderSaves();
}

function loadSaves() {
  try {
    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function renderSaves() {
  savesList.innerHTML = '';
  const saves = loadSaves();
  if (!saves.length) {
    const empty = document.createElement('div');
    empty.className = 'small';
    empty.textContent = 'No saves yet. Click Save to store your drawing in the browser.';
    savesList.appendChild(empty);
    return;
  }
  saves.forEach(s => {
    const item = document.createElement('div');
    item.className = 'save-item';
    const img = document.createElement('img');
    img.className = 'save-thumb';
    img.src = s.dataUrl;
    img.alt = 'save thumbnail';
    img.addEventListener('click', () => {
      if (!confirm('Replace canvas with this saved image?')) return;
      const image = new Image();
      image.onload = () => {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        ctx.restore();
        drawGuides();
      };
      image.src = s.dataUrl;
    });

    const meta = document.createElement('div');
    meta.className = 'save-meta';
    const left = document.createElement('div');
    left.innerHTML = `<div style="font-weight:600">${new Date(s.created).toLocaleString()}</div><div class="small">Saved in browser</div>`;

    const right = document.createElement('div');
    right.style.display = 'flex';
    right.style.gap = '6px';

    const openBtn = document.createElement('button');
    openBtn.innerText = 'Open';
    openBtn.addEventListener('click', () => {
      const w = window.open();
      w.document.write(`<img src="${s.dataUrl}" style="max-width:100%;height:auto;display:block;margin:0"/>`);
    });

    const remove = document.createElement('button');
    remove.innerText = 'X';
    remove.className = 'danger';
    remove.title = 'Delete save';
    remove.addEventListener('click', () => {
      if (!confirm('Delete this save?')) return;
      const arr = loadSaves().filter(x => x.id !== s.id);
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(arr));
      renderSaves();
    });

    right.appendChild(openBtn);
    right.appendChild(remove);
    meta.appendChild(left);
    meta.appendChild(right);
    item.appendChild(img);
    item.appendChild(meta);
    savesList.appendChild(item);
  });
}

saveBtn.addEventListener('click', saveCurrent);
renderSaves();

downloadBtn.addEventListener('click', () => {
  const dataUrl = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'drawing.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

/* ===== Guide rendering ===== */
function drawGuides() {
  gctx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);
  gctx.save();
  gctx.strokeStyle = '#000000';
  gctx.lineWidth = 1;
  gctx.globalAlpha = 0.15;

  const w = canvas.width, h = canvas.height;

  if (state.symmetryMode === 'vertical' || state.symmetryMode === 'both') {
    gctx.beginPath();
    gctx.moveTo(w / 2, 0);
    gctx.lineTo(w / 2, h);
    gctx.stroke();
  }

  if (state.symmetryMode === 'horizontal' || state.symmetryMode === 'both') {
    gctx.beginPath();
    gctx.moveTo(0, h / 2);
    gctx.lineTo(w, h / 2);
    gctx.stroke();
  }

  if (state.symmetryMode === 'radial') {
    gctx.translate(w / 2, h / 2);
    for (let i = 0; i < state.radialN; i++) {
      const ang = i * 2 * Math.PI / state.radialN;
      gctx.beginPath();
      gctx.moveTo(0, 0);
      gctx.lineTo(Math.cos(ang) * w, Math.sin(ang) * h);
      gctx.stroke();
    }
    gctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  if (state.tiled) {
    gctx.beginPath();
    gctx.rect(0, 0, w, h);
    gctx.stroke();
    gctx.beginPath();
    gctx.moveTo(w / 2, 0);
    gctx.lineTo(w / 2, h);
    gctx.moveTo(0, h / 2);
    gctx.lineTo(w, h / 2);
    gctx.stroke();
  }

  gctx.restore();
}

/* ===== Keyboard shortcuts ===== */
window.addEventListener('keydown', (e) => {
  if (e.key === 'b') {
    state.tool = 'pencil';
    state.eraserActive = false;
    updateUI();
  }
  if (e.key === 'e') {
    state.eraserActive = !state.eraserActive;
    state.tool = state.eraserActive ? 'erase' : 'pencil';
    updateUI();
  }
  if (e.key === 'f') {
    state.tool = 'fill';
    state.eraserActive = false;
    updateUI();
  }
  if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    saveCurrent();
  }
});
</script>
