<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>9028 — Symmetry & Tiled Modes</title>
<style>
  :root{--bg:#f3f4f6;--panel:#fff;--accent:#0b74de;--muted:#6b7280;--danger:#ef4444}
  html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#111}
  .app{max-width:1280px;margin:18px auto;padding:16px;background:linear-gradient(180deg,#fff,#fbfdff);box-shadow:0 8px 30px rgba(15,23,42,0.06);border-radius:12px;display:grid;grid-template-columns:360px 1fr;gap:16px}
  .panel{background:var(--panel);padding:12px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(0,0,0,0.02)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button, select, input[type=range], input[type=color], input[type=text] {font-size:14px}
  button{background:#fff;border:1px solid #e6e9ee;padding:8px 10px;border-radius:8px;cursor:pointer}
  button.active{border-color:var(--accent);box-shadow:0 6px 14px rgba(11,116,222,0.12)}
  .colors{display:flex;gap:8px;flex-wrap:wrap}
  .color-swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid rgba(0,0,0,0.06)}
  .tools-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .canvas-wrap{position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(45deg,#fff,#f7fbff);display:flex;flex-direction:column}
  canvas{background:white;touch-action:none;display:block;width:100%;height:100%}
  .controls{display:flex;align-items:center;gap:10px;margin-top:8px}
  .saves{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto;padding-right:6px}
  .save-item{display:flex;align-items:center;gap:8px;background:#fbfdff;border-radius:8px;padding:6px;border:1px solid #eef3ff}
  .save-thumb{width:72px;height:50px;border-radius:6px;object-fit:cover;background:#fff;border:1px solid #e6eefc}
  .save-meta{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .small{font-size:13px;color:var(--muted)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .right-actions{display:flex;gap:8px;align-items:center}
  .title{font-weight:600}
  .danger{background:linear-gradient(180deg,#fff 0,#fff);border-color:var(--danger);color:var(--danger)}
  .row{display:flex;gap:8px;align-items:center}
  input.hex{width:110px;padding:6px;border-radius:6px;border:1px solid #e6e9ee}
  .color-preview{width:34px;height:34px;border-radius:6px;border:1px solid #e6e9ee}
  footer{grid-column:1/-1;margin-top:10px;text-align:center;color:var(--muted);font-size:13px}
  @media (max-width:920px){.app{grid-template-columns:1fr;max-width:920px}}
</style>
</head>
<body>
<div class="app" role="application" aria-label="Drawing app">
  <div class="panel" aria-hidden="false">
    <div class="topbar">
      <div>
        <div class="title">Canvas Rival — Symmetry & Tiled</div>
        <div class="small">Mirror, radial symmetry and seamless tiled repeat</div>
      </div>
      <div class="right-actions">
        <button id="downloadBtn" title="Download PNG">Download</button>
        <button id="clearBtn" title="Clear canvas">Clear</button>
      </div>
    </div>

    <div class="tools-row">
      <div class="toolbar" role="toolbar" aria-label="tools">
        <button id="pencilBtn" class="active" title="Pencil">Pencil</button>
        <button id="fillBtn" title="Fill bucket">Fill</button>
        <button id="eraseBtn" title="Eraser">Eraser</button>
        <button id="saveBtn" title="Save to localStorage" style="background:linear-gradient(180deg,#eaf4ff,#dff0ff);border-color:#cbe7ff">Save</button>
      </div>
    </div>

    <div style="margin-top:8px">
      <label class="small">Brush size</label>
      <div class="controls">
        <input id="sizeRange" type="range" min="1" max="160" value="12" />
        <div id="sizeIndicator" class="small">12 px</div>
      </div>
    </div>

    <div style="margin-top:10px">
      <label class="small">Colors</label>
      <div class="colors" id="presetColors" style="margin-top:8px"></div>
      <div style="margin-top:8px" class="row">
        <input id="colorPicker" type="color" value="#111111" title="Color wheel" />
        <div style="display:flex;flex-direction:column;margin-left:6px">
          <label class="small">Hue</label>
          <input id="hueRange" type="range" min="0" max="360" value="0" />
        </div>
        <div style="display:flex;flex-direction:column;margin-left:6px">
          <label class="small">Preview</label>
          <div id="colorPreview" class="color-preview" title="Current color"></div>
        </div>
      </div>
      <div style="margin-top:8px" class="row">
        <input id="hexInput" class="hex" type="text" placeholder="Hex e.g. ffffdd or #ffffdd" maxlength="7" />
        <button id="applyHex">Apply</button>
      </div>
    </div>

    <div style="margin-top:12px">
      <label class="small">Texture</label>
      <div style="margin-top:8px" class="row">
        <select id="textureSelect" aria-label="Select texture">
          <option value="none">None</option>
          <option value="sandpaper">Sandpaper</option>
          <option value="watercolor">Watercolor</option>
          <option value="glow">Glowing</option>
        </select>
        <div class="small" id="textureInfo">None</div>
      </div>
      <div id="glowControls" style="margin-top:8px;display:none">
        <label class="small">Glow intensity</label>
        <input id="glowRange" type="range" min="0" max="3" step="0.1" value="1" />
        <div class="small" id="glowValue">1.0</div>
      </div>
    </div>

    <hr style="margin:12px 0">

    <div>
      <label class="small">Symmetry</label>
      <div style="margin-top:8px" class="row">
        <select id="symmetryMode">
          <option value="off">Off</option>
          <option value="vertical">Mirror Vertical</option>
          <option value="horizontal">Mirror Horizontal</option>
          <option value="both">Mirror Both</option>
          <option value="radial">Radial N-way</option>
        </select>
        <div class="small" id="symInfo">Off</div>
      </div>
      <div id="radialControls" style="margin-top:8px;display:none" class="row">
        <label class="small">Spokes</label>
        <input id="radialSpokes" type="range" min="2" max="18" value="6" />
        <div class="small" id="radialValue">6</div>
      </div>

      <div style="margin-top:10px" class="row">
        <label class="small">Tiled Seamless Repeat</label>
        <input id="tileToggle" type="checkbox" />
        <div class="small" style="margin-left:6px">Wrap strokes across edges (2×2 repeat)</div>
      </div>
    </div>

    <div style="margin-top:12px">
      <label class="small">Saves</label>
      <div class="saves" id="savesList" aria-live="polite"></div>
    </div>
  </div>

  <div class="canvas-wrap panel" style="padding:12px">
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
      <div class="small">Canvas</div>
      <div class="small" id="canvasSizeLabel">1600 × 840</div>
    </div>
    <div style="flex:1; min-height:420px;position:relative;">
      <canvas id="canvas" width="1600" height="840" aria-label="Drawing canvas"></canvas>
      <!-- optional overlay to show symmetry guides -->
      <canvas id="guideCanvas" width="1600" height="840" aria-hidden="true" style="position:absolute;left:12px;top:12px;pointer-events:none;opacity:0.25"></canvas>
    </div>
  </div>
</div>

<footer>
  Symmetry duplicates stamps geometrically; tiled repeat wraps stamps at edges. Save as usual.
</footer>

<script>
/* ===== App state & elements ===== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const guideCanvas = document.getElementById('guideCanvas');
const gctx = guideCanvas.getContext('2d');
const pencilBtn = document.getElementById('pencilBtn');
const fillBtn = document.getElementById('fillBtn');
const eraseBtn = document.getElementById('eraseBtn');
const saveBtn = document.getElementById('saveBtn');
const clearBtn = document.getElementById('clearBtn');
const downloadBtn = document.getElementById('downloadBtn');
const sizeRange = document.getElementById('sizeRange');
const sizeIndicator = document.getElementById('sizeIndicator');
const colorPicker = document.getElementById('colorPicker');
const hueRange = document.getElementById('hueRange');
const colorPreview = document.getElementById('colorPreview');
const presetColors = document.getElementById('presetColors');
const hexInput = document.getElementById('hexInput');
const applyHex = document.getElementById('applyHex');
const savesList = document.getElementById('savesList');
const canvasSizeLabel = document.getElementById('canvasSizeLabel');
const textureSelect = document.getElementById('textureSelect');
const textureInfo = document.getElementById('textureInfo');
const glowControls = document.getElementById('glowControls');
const glowRange = document.getElementById('glowRange');
const glowValue = document.getElementById('glowValue');

const symmetryModeSelect = document.getElementById('symmetryMode');
const symInfo = document.getElementById('symInfo');
const radialControls = document.getElementById('radialControls');
const radialSpokes = document.getElementById('radialSpokes');
const radialValue = document.getElementById('radialValue');
const tileToggle = document.getElementById('tileToggle');

let drawing = false;
let lastPos = {x:0,y:0};
let tool = 'pencil';
let brushSize = parseInt(sizeRange.value,10);
let color = colorPicker.value;
let alpha = 1.0;
let eraserActive = false;
let texture = 'none';
let glowIntensity = parseFloat(glowRange.value);
let symmetryMode = 'off';
let radialN = parseInt(radialSpokes.value,10);
let tiled = false;

/* ===== Initialize canvas sizes/backing ===== */
function initCanvas(){
  canvas.width = 2000; canvas.height = 1040;
  guideCanvas.width = canvas.width; guideCanvas.height = canvas.height;
  canvasSizeLabel.textContent = canvas.width + ' × ' + canvas.height;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  drawGuides();
}
initCanvas();

/* ===== Preset colors ===== */
const preset = ['#000000','#ffffff','#ff3b30','#ff9500','#ffd60a','#32d74b','#0a84ff','#5856d6','#ff2d55','#8e8e93'];
preset.forEach(c=>{
  const s = document.createElement('div');
  s.className = 'color-swatch';
  s.style.background = c;
  s.title = c;
  s.addEventListener('click', ()=> setColor(c));
  presetColors.appendChild(s);
});

/* ===== Color controls ===== */
function setColor(hex){
  if (!hex.startsWith('#')) hex = '#'+hex;
  const isValid = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(hex);
  if (!isValid) return;
  color = expandHex(hex);
  colorPicker.value = color;
  const h = rgbToHslHex(color);
  hueRange.value = Math.round(h);
  updateColorPreview();
}
function expandHex(h){
  if (h.length === 4) return '#' + h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
  return h;
}
function updateColorPreview(){ colorPreview.style.background = color; }
colorPicker.addEventListener('input', ()=> { color = colorPicker.value; hueRange.value = Math.round(rgbToHslHex(color)); updateColorPreview(); });
hueRange.addEventListener('input', ()=> { const h = parseInt(hueRange.value,10); const rgb = hslToRgb(h,70,40); color = rgbToHex(rgb.r,rgb.g,rgb.b); colorPicker.value = color; updateColorPreview(); });
applyHex.addEventListener('click', ()=> { const v = hexInput.value.trim(); if (!v) return; const s = v.replace('#','').toLowerCase(); if (!/^([0-9a-f]{3}|[0-9a-f]{6})$/.test(s)) { alert('Invalid hex'); return; } setColor(s); });
hexInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') applyHex.click(); });
updateColorPreview();

/* helper color conversions */
function rgbToHex(r,g,b){ const toHex = v => ('0'+v.toString(16)).slice(-2); return '#'+toHex(r)+toHex(g)+toHex(b); }
function hslToRgb(h,s,l){ s/=100; l/=100; const k = n => (n + h/30) % 12; const a = s * Math.min(l,1-l); const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1))); return {r:Math.round(255*f(0)), g:Math.round(255*f(8)), b:Math.round(255*f(4))}; }
function rgbToHslHex(hex){ const h = hex.replace('#',''); const bigint = parseInt(h,16); const r = ((bigint>>16)&255)/255; const g = ((bigint>>8)&255)/255; const b = (bigint&255)/255; const max = Math.max(r,g,b), min = Math.min(r,g,b); let H=0; if (max === min) H = 0; else if (max === r) H = (60 * ((g - b) / (max - min)) + 360) % 360; else if (max === g) H = (60 * ((b - r) / (max - min)) + 120) % 360; else if (max === b) H = (60 * ((r - g) / (max - min)) + 240) % 360; return H; }

/* ===== UI updates ===== */
function updateUI(){
  pencilBtn.classList.toggle('active', tool === 'pencil' && !eraserActive);
  fillBtn.classList.toggle('active', tool === 'fill');
  eraseBtn.classList.toggle('active', eraserActive);
  sizeIndicator.textContent = brushSize + ' px';
  textureInfo.textContent = texture.charAt(0).toUpperCase() + texture.slice(1);
  glowControls.style.display = texture === 'glow' ? 'flex' : 'none';
  glowValue.textContent = glowIntensity.toFixed(1);
  symInfo.textContent = symmetryMode.charAt(0).toUpperCase() + symmetryMode.slice(1);
  radialControls.style.display = symmetryMode === 'radial' ? 'flex' : 'none';
  radialValue.textContent = radialN;
}
updateUI();

/* ===== Tool wiring ===== */
pencilBtn.addEventListener('click', ()=>{ tool='pencil'; eraserActive=false; updateUI(); });
fillBtn.addEventListener('click', ()=>{ tool='fill'; eraserActive=false; updateUI(); });
eraseBtn.addEventListener('click', ()=>{ eraserActive = !eraserActive; tool = eraserActive ? 'erase' : 'pencil'; updateUI(); });
sizeRange.addEventListener('input', ()=>{ brushSize = parseInt(sizeRange.value,10); updateUI(); });
textureSelect.addEventListener('change', ()=>{ texture = textureSelect.value; updateUI(); });
glowRange.addEventListener('input', ()=>{ glowIntensity = parseFloat(glowRange.value); updateUI(); });
clearBtn.addEventListener('click', ()=>{ ctx.save(); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.restore(); drawGuides(); });

symmetryModeSelect.addEventListener('change', ()=>{ symmetryMode = symmetryModeSelect.value; updateUI(); drawGuides(); });
radialSpokes.addEventListener('input', ()=>{ radialN = parseInt(radialSpokes.value,10); radialValue.textContent = radialN; });
tileToggle.addEventListener('change', ()=>{ tiled = tileToggle.checked; drawGuides(); });

/* ===== Pointer helpers ===== */
function getPosFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }
  return {
    x: Math.round((clientX - rect.left) * (canvas.width / rect.width)),
    y: Math.round((clientY - rect.top) * (canvas.height / rect.height))
  };
}

/* ===== Symmetry / tiled coordinate generator =====
 For a primary stamp at (x,y) produce an array of replicated coords
 respecting current symmetryMode, radialN, and tiled wrap.
*/
function replicatedPoints(x,y){
  const w = canvas.width, h = canvas.height;
  const points = [];
  // helper to add and optionally wrap into tiled duplicates
  function addPoint(px,py){
    if (!tiled){
      points.push([px,py]);
      return;
    }
    // if tiled: 2x2 repeat (center + shifts by ±w, ±h) so patterns tile seamlessly
    const shifts = [-w, 0, w];
    const vshifts = [-h, 0, h];
    for (const sx of shifts){
      for (const sy of vshifts){
        points.push([px + sx, py + sy]);
      }
    }
  }

  if (symmetryMode === 'off'){
    addPoint(x,y);
    return points;
  }

  const cx = w/2, cy = h/2;

  if (symmetryMode === 'vertical' || symmetryMode === 'both'){
    // vertical mirror across center x = cx
    const mx = Math.round(cx*2 - x);
    addPoint(x,y);
    addPoint(mx,y);
    if (symmetryMode === 'both') {
      // also horizontal mirror
      const my = Math.round(cy*2 - y);
      addPoint(x,my);
      addPoint(mx,my);
    }
    return points;
  }

  if (symmetryMode === 'horizontal'){
    const my = Math.round(cy*2 - y);
    addPoint(x,y);
    addPoint(x,my);
    return points;
  }

  if (symmetryMode === 'radial'){
    // rotate point around center for radialN spokes; preserve distance and angle
    const dx = x - cx, dy = y - cy;
    const r = Math.hypot(dx,dy);
    const baseAngle = Math.atan2(dy,dx);
    for (let k=0;k<radialN;k++){
      const ang = baseAngle + (k * 2*Math.PI / radialN);
      const px = Math.round(cx + r * Math.cos(ang));
      const py = Math.round(cy + r * Math.sin(ang));
      addPoint(px,py);
    }
    return points;
  }

  // fallback
  addPoint(x,y);
  return points;
}

/* ===== Drawing (stamp) pipeline: uses replicatedPoints to draw duplicates ===== */
function applyStamp(x,y){
  // Compute all stamp positions first (unique by coordinate)
  const rawPoints = replicatedPoints(x,y);
  // remove duplicates
  const uniq = [];
  const setKey = new Set();
  rawPoints.forEach(p=>{
    const k = p[0] + ':' + p[1];
    if (!setKey.has(k)){ setKey.add(k); uniq.push(p); }
  });

  // For each position, apply the current texture/brush at that location
  uniq.forEach(([px,py]) => {
    // If point is outside canvas AND not tiled we skip
    if (!tiled && (px < 0 || py < 0 || px > canvas.width || py > canvas.height)) return;
    // For tiled points placed outside primary canvas, drawing still applies correctly (they may be negative)
    drawStampAt(px, py);
  });
}

/* drawStampAt draws the configured brush at absolute coordinates px,py.
   It uses the same texture implementations (none, sandpaper, watercolor, glow).
*/
function drawStampAt(px, py){
  if (eraserActive){
    ctx.save(); ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(px, py, Math.max(1, brushSize/2), 0, Math.PI*2); ctx.fill(); ctx.restore(); return;
  }

  if (texture === 'none'){
    ctx.save(); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = hexToRgba(color, alpha);
    ctx.beginPath(); ctx.arc(px, py, Math.max(1, brushSize/2), 0, Math.PI*2); ctx.fill(); ctx.restore();
    return;
  }

  if (texture === 'sandpaper'){
    ctx.save(); ctx.globalCompositeOperation = 'source-over';
    const baseA = alpha * 0.95;
    const grit = Math.max(8, Math.floor(brushSize * 0.45));
    for (let i=0;i<grit;i++){
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * brushSize * 0.55;
      const rx = px + Math.cos(angle) * radius;
      const ry = py + Math.sin(angle) * radius;
      const size = Math.max(0.5, (Math.random() * 0.6 + 0.2) * (brushSize/8));
      ctx.fillStyle = hexToRgba(color, baseA * (0.4 + Math.random()*0.8));
      ctx.beginPath(); ctx.arc(rx, ry, size, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore(); return;
  }

  if (texture === 'watercolor'){
    const off = document.createElement('canvas');
    off.width = Math.ceil(brushSize*3); off.height = Math.ceil(brushSize*3);
    const octx = off.getContext('2d'); const cx = off.width/2, cy = off.height/2;
    octx.clearRect(0,0,off.width,off.height);
    for (let i=0;i<6;i++){
      const s = (0.6 + Math.random()*0.8) * (brushSize/2);
      const rx = cx + (Math.random()-0.5) * brushSize*0.4;
      const ry = cy + (Math.random()-0.5) * brushSize*0.4;
      octx.beginPath(); octx.fillStyle = hexToRgba(color, alpha * (0.12 + Math.random()*0.18));
      octx.ellipse(rx, ry, s, s * (0.6 + Math.random()*0.6), Math.random()*Math.PI, 0, Math.PI*2); octx.fill();
    }
    const tmp = document.createElement('canvas'); tmp.width = Math.max(1, Math.floor(off.width / 3)); tmp.height = Math.max(1, Math.floor(off.height / 3));
    const tctx = tmp.getContext('2d'); tctx.drawImage(off, 0, 0, tmp.width, tmp.height);
    octx.clearRect(0,0,off.width,off.height); octx.globalAlpha = 1.0; octx.drawImage(tmp, 0, 0, tmp.width, tmp.height, 0, 0, off.width, off.height);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(off, px - cx, py - cy); ctx.restore(); return;
  }

  if (texture === 'glow'){
    const off = document.createElement('canvas');
    const diameter = Math.ceil(brushSize * 3.2);
    off.width = diameter; off.height = diameter;
    const octx = off.getContext('2d'); const cx = diameter/2, cy = diameter/2;
    octx.clearRect(0,0,off.width,off.height);
    // core
    octx.beginPath(); octx.fillStyle = hexToRgba(color, Math.min(1, alpha)); octx.arc(cx, cy, brushSize/2, 0, Math.PI*2); octx.fill();
    // glow rings
    const gcount = Math.max(3, Math.round(2 + glowIntensity*3));
    for (let i=0;i<gcount;i++){
      const grd = octx.createRadialGradient(cx, cy, brushSize*0.2, cx, cy, brushSize*(1.2 + i*0.9));
      const alphaOuter = Math.min(0.35 * glowIntensity, 0.75) * (1 - i*0.18);
      grd.addColorStop(0, hexToRgba(color, alphaOuter));
      grd.addColorStop(1, hexToRgba(color, 0));
      octx.globalCompositeOperation = 'lighter';
      octx.fillStyle = grd; octx.beginPath(); octx.arc(cx, cy, brushSize*(1.2 + i*0.9), 0, Math.PI*2); octx.fill();
    }
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(off, px - cx, py - cy); ctx.restore(); return;
  }
}

/* ===== Stroke movement handling (stamp along line) ===== */
function beginStroke(pos){ drawing = true; lastPos = pos; }
function moveStroke(pos){ if (!drawing) return; const dist = Math.hypot(pos.x - lastPos.x, pos.y - lastPos.y); const steps = Math.max(1, Math.floor(dist / Math.max(1, brushSize / 6))); for (let i=0;i<=steps;i++){ const t = i/steps; const x = Math.round(lastPos.x + (pos.x - lastPos.x) * t); const y = Math.round(lastPos.y + (pos.y - lastPos.y) * t); applyStamp(x,y); } lastPos = pos; }
function endStroke(){ drawing = false; }

/* ===== Pointer events ===== */
canvas.addEventListener('pointerdown', (e)=> {
  canvas.setPointerCapture(e.pointerId);
  const pos = getPosFromEvent(e);
  if (tool === 'fill'){ const rgba = colorToRgba(color, alpha); floodFill(canvas, pos.x, pos.y, rgba); drawGuides(); return; }
  beginStroke(pos); applyStamp(pos.x, pos.y); drawGuides();
});
canvas.addEventListener('pointermove', (e)=> { const pos = getPosFromEvent(e); if (drawing) moveStroke(pos); });
canvas.addEventListener('pointerup', (e)=> { endStroke(); });
canvas.addEventListener('pointercancel', ()=> endStroke());
canvas.addEventListener('touchstart', (e)=>{}, {passive:true});

/* ===== Simple flood fill (kept from previous versions) ===== */
function getPixelIndex(x,y,w){ return (y*w + x) * 4; }
function colorsMatch(px, target){ return px[0] === target[0] && px[1] === target[1] && px[2] === target[2] && px[3] === target[3]; }
function floodFill(canvasEl, startX, startY, fillRGBA){
  const w = canvasEl.width, h = canvasEl.height;
  const ctxLocal = canvasEl.getContext('2d');
  let img = ctxLocal.getImageData(0,0,w,h); const data = img.data;
  const startIdx = getPixelIndex(startX, startY, w);
  const target = [data[startIdx], data[startIdx+1], data[startIdx+2], data[startIdx+3]];
  const replacement = [fillRGBA.r, fillRGBA.g, fillRGBA.b, fillRGBA.a];
  if (target[0] === replacement[0] && target[1] === replacement[1] && target[2] === replacement[2] && target[3] === replacement[3]) return;
  const stack = [[startX, startY]];
  while(stack.length){
    const [sx,sy] = stack.pop(); let x = sx, y = sy; let idx = getPixelIndex(x,y,w);
    while(y >= 0 && colorsMatch([data[idx],data[idx+1],data[idx+2],data[idx+3]], target)){ y--; idx -= w*4; if (y < 0) break; }
    y++; idx += w*4; let reachLeft=false, reachRight=false;
    while(y < h && colorsMatch([data[idx],data[idx+1],data[idx+2],data[idx+3]], target)){
      data[idx] = replacement[0]; data[idx+1] = replacement[1]; data[idx+2] = replacement[2]; data[idx+3] = replacement[3];
      if (x > 0){
        if (colorsMatch([data[idx-4],data[idx-3],data[idx-2],data[idx-1]], target)){
          if (!reachLeft){ stack.push([x-1,y]); reachLeft = true; }
        } else reachLeft = false;
      }
      if (x < w-1){
        if (colorsMatch([data[idx+4],data[idx+5],data[idx+6],data[idx+7]], target)){
          if (!reachRight){ stack.push([x+1,y]); reachRight = true; }
        } else reachRight = false;
      }
      y++; idx += w*4;
    }
  }
  ctxLocal.putImageData(img,0,0);
}

/* ===== Color helpers ===== */
function hexToRgba(hex, a){ if (!hex) hex = '#000000'; if (!hex.startsWith('#')) hex = '#'+hex; const h = expandHex(hex).replace('#',''); const bigint = parseInt(h,16); const r = (bigint>>16)&255; const g = (bigint>>8)&255; const b = bigint&255; return `rgba(${r},${g},${b},${a})`; }
function colorToRgba(hex, a){ if (!hex.startsWith('#')) hex = '#'+hex; const h = expandHex(hex).replace('#',''); const bigint = parseInt(h,16); const r = (bigint>>16)&255; const g = (bigint>>8)&255; const b = bigint&255; return {r,g,b,a: Math.round(a*255)}; }

/* ===== Saves / gallery (unchanged pattern) ===== */
const STORAGE_KEY = 'canvas-rival-saves-v4';
function saveCurrent(){ const dataUrl = canvas.toDataURL('image/png'); const saves = loadSaves(); const id = 's-' + Date.now(); saves.unshift({id, dataUrl, created: new Date().toISOString()}); localStorage.setItem(STORAGE_KEY, JSON.stringify(saves.slice(0,50))); renderSaves(); }
function loadSaves(){ try{ const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return []; return JSON.parse(raw); }catch(e){ return []; } }
function renderSaves(){ savesList.innerHTML=''; const saves = loadSaves(); if (!saves.length){ const empty = document.createElement('div'); empty.className='small'; empty.textContent='No saves yet. Click Save to store your drawing in the browser.'; savesList.appendChild(empty); return; } saves.forEach(s=>{ const item=document.createElement('div'); item.className='save-item'; const img=document.createElement('img'); img.className='save-thumb'; img.src=s.dataUrl; img.alt='save thumbnail'; img.addEventListener('click', ()=>{ if(!confirm('Replace canvas with this saved image?')) return; const image=new Image(); image.onload=()=>{ ctx.save(); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(image,0,0,canvas.width,canvas.height); ctx.restore(); drawGuides(); }; image.src=s.dataUrl; }); const meta=document.createElement('div'); meta.className='save-meta'; const left=document.createElement('div'); left.innerHTML='<div style="font-weight:600">'+ (new Date(s.created)).toLocaleString() +'</div><div class="small">Saved in browser</div>'; const right=document.createElement('div'); right.style.display='flex'; right.style.gap='6px'; const openBtn=document.createElement('button'); openBtn.innerText='Open'; openBtn.addEventListener('click', ()=>{ const w = window.open(); w.document.write('<img src="'+s.dataUrl+'" style="max-width:100%;height:auto;display:block;margin:0"/>'); }); const remove=document.createElement('button'); remove.innerText='X'; remove.className='danger'; remove.title='Delete save'; remove.addEventListener('click', ()=>{ if(!confirm('Delete this save?')) return; const arr = loadSaves().filter(x=>x.id !== s.id); localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); renderSaves(); }); right.appendChild(openBtn); right.appendChild(remove); meta.appendChild(left); meta.appendChild(right); item.appendChild(img); item.appendChild(meta); savesList.appendChild(item); }); }
saveBtn.addEventListener('click', saveCurrent); renderSaves();
downloadBtn.addEventListener('click', ()=>{ const dataUrl = canvas.toDataURL('image/png'); const a = document.createElement('a'); a.href = dataUrl; a.download = 'drawing.png'; document.body.appendChild(a); a.click(); a.remove(); });

/* ===== Guides rendering to help user visualize symmetry / tiling ===== */
function drawGuides(){
  gctx.clearRect(0,0,guideCanvas.width, guideCanvas.height);
  gctx.save();
  gctx.strokeStyle = '#000000'; gctx.lineWidth = 1; gctx.globalAlpha = 0.15;
  const w = canvas.width, h = canvas.height;
  if (symmetryMode === 'vertical' || symmetryMode === 'both'){
    gctx.beginPath(); gctx.moveTo(w/2,0); gctx.lineTo(w/2,h); gctx.stroke();
  }
  if (symmetryMode === 'horizontal' || symmetryMode === 'both'){
    gctx.beginPath(); gctx.moveTo(0,h/2); gctx.lineTo(w,h/2); gctx.stroke();
  }
  if (symmetryMode === 'radial'){
    gctx.translate(w/2, h/2);
    for (let i=0;i<radialN;i++){
      const ang = i * 2*Math.PI / radialN;
      gctx.beginPath(); gctx.moveTo(0,0); gctx.lineTo(Math.cos(ang)*w, Math.sin(ang)*h); gctx.stroke();
    }
    gctx.setTransform(1,0,0,1,0,0);
  }
  if (tiled){
    gctx.beginPath(); gctx.rect(0,0,w,h); gctx.stroke();
    // draw tile boundaries (centered repeats)
    gctx.beginPath(); gctx.moveTo(w/2,0); gctx.lineTo(w/2,h); gctx.moveTo(0,h/2); gctx.lineTo(w,h/2); gctx.stroke();
  }
  gctx.restore();
}

/* ===== Keyboard shortcuts (small set) ===== */
window.addEventListener('keydown', (e)=>{
  if (e.key === 'b') { tool='pencil'; eraserActive=false; updateUI(); }
  if (e.key === 'e') { eraserActive = !eraserActive; tool = eraserActive ? 'erase' : 'pencil'; updateUI(); }
  if (e.key === 'f') { tool='fill'; eraserActive=false; updateUI(); }
  if (e.key === 's' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); saveCurrent(); }
});

/* ===== Utilities note ===== */
/* - replicatedPoints returns the coordinates to stamp, with tiled option producing 3x3 grid of repeats.
   - radial symmetry rotates stamps about canvas center; mirror modes reflect across horizontal/vertical centerlines.
   - tiled repeat wraps strokes across edges so generated images will tile in a 2x2 repeat.
*/
